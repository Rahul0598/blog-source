<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="globe"></canvas>
<script>
(function() {
  var canvas = document.getElementById("globe");
  var ctx = canvas.getContext("2d");

  // Simplified continent outlines: arrays of [lon, lat] polylines
  // Heavily reduced point sets for a clean wireframe aesthetic
  var CONTINENTS = [
    // North America
    [[-130,55],[-125,50],[-124,42],[-117,33],[-105,25],[-97,19],[-96,16],[-88,15],[-83,10],[-80,8],[-77,9],[-82,22],[-81,25],[-80,27],[-81,31],[-75,35],[-70,41],[-67,45],[-66,50],[-60,47],[-64,44],[-67,45],[-71,42],[-74,40],[-75,35],[-77,34],[-79,33],[-81,31],[-85,30],[-89,29],[-94,29],[-97,26],[-97,28],[-95,29],[-94,30],[-91,30],[-90,29],[-89,30],[-85,30],[-83,28],[-81,25],[-80,25],[-82,24]],
    [[-97,50],[-95,49],[-88,48],[-84,46],[-82,43],[-79,43],[-76,44],[-75,45],[-71,45],[-69,47],[-67,47],[-65,48],[-64,47],[-60,47],[-56,47],[-53,47],[-55,52],[-60,54],[-64,58],[-68,59],[-75,62],[-80,63],[-85,65],[-90,68],[-100,70],[-110,69],[-120,71],[-130,70],[-137,69],[-141,70],[-141,60],[-140,54],[-135,55],[-130,55],[-125,60],[-123,55],[-122,49],[-123,49],[-124,50],[-126,51],[-128,53],[-130,55]],
    // Central America bridge
    [[-88,18],[-86,16],[-84,15],[-83,14],[-82,11],[-80,9],[-79,8],[-77,8]],
    // South America
    [[-80,5],[-77,0],[-80,-3],[-81,-5],[-75,-10],[-71,-15],[-68,-22],[-67,-25],[-63,-30],[-58,-34],[-56,-35],[-53,-33],[-50,-28],[-48,-25],[-46,-24],[-43,-23],[-41,-20],[-39,-15],[-38,-12],[-35,-8],[-35,-5],[-50,0],[-52,2],[-57,6],[-60,7],[-63,10],[-67,11],[-72,12],[-75,11],[-77,8],[-80,5]],
    // Europe
    [[-10,36],[-6,37],[0,38],[3,42],[0,43],[-2,43],[-9,43],[-9,44],[3,43],[5,44],[7,44],[11,44],[13,45],[14,45],[15,44],[16,46],[14,47],[10,47],[7,48],[6,49],[3,49],[2,51],[-5,50],[-6,54],[-3,56],[-5,58],[-3,58],[0,58],[5,57],[7,55],[8,54],[10,55],[12,55],[12,57],[11,58],[11,60],[10,63],[14,65],[18,68],[20,70],[25,71],[28,70],[30,70],[30,68],[28,66],[25,60],[22,55],[21,55],[18,55],[14,54],[12,54],[13,52],[7,53],[4,52],[3,51],[2,51]],
    // Africa
    [[-17,15],[-16,12],[-15,11],[-8,5],[-5,5],[1,5],[5,4],[10,4],[10,2],[9,1],[9,0],[12,-5],[15,-5],[18,-10],[20,-15],[25,-18],[28,-22],[30,-26],[33,-30],[35,-34],[28,-33],[25,-32],[20,-30],[18,-29],[16,-28],[14,-24],[12,-18],[10,-10],[5,0],[2,5],[1,6],[-5,5],[-8,5],[-13,10],[-17,14],[-17,15]],
    [[-5,36],[-2,35],[0,36],[2,36],[3,37],[5,36],[8,37],[10,37],[11,34],[10,31],[12,33],[15,33],[20,32],[25,32],[30,31],[33,30],[35,30],[35,28],[33,28],[33,25],[40,15],[45,12],[50,11],[43,11],[38,8],[42,2],[40,-2],[38,-6],[35,-8],[33,-10],[31,-15],[30,-20],[33,-25],[35,-34]],
    // Asia  
    [[30,70],[35,70],[40,68],[45,68],[50,67],[55,68],[60,70],[70,73],[80,72],[90,73],[100,72],[110,70],[120,68],[130,65],[135,60],[140,55],[142,50],[145,45],[140,43],[135,35],[130,33],[128,35],[126,34],[125,35],[122,30],[121,25],[118,23],[115,22],[110,20],[108,15],[106,10],[105,10],[100,5],[98,3],[104,1],[110,-2],[115,-5],[118,-6],[120,-8],[116,-8],[110,-7],[105,-6],[100,0],[98,3],[95,5],[88,22],[85,22],[82,18],[80,10],[78,8],[76,8],[74,13],[72,18],[68,24],[66,25],[62,25],[58,23],[53,25],[48,29],[45,30],[42,32],[40,35],[37,36],[35,35],[33,35],[30,35],[28,32],[35,30],[35,31]],
    // Australia
    [[115,-20],[120,-18],[125,-15],[130,-12],[135,-12],[137,-15],[140,-18],[145,-20],[148,-23],[150,-25],[153,-27],[153,-30],[150,-35],[148,-38],[145,-38],[140,-36],[137,-35],[135,-34],[130,-32],[125,-33],[120,-34],[115,-34],[114,-30],[113,-25],[114,-22],[115,-20]],
    // Japan
    [[130,31],[131,33],[132,34],[134,35],[136,35],[137,37],[139,38],[140,39],[140,41],[141,43],[145,43],[145,45],[142,45]],
    // UK/Ireland
    [[-6,50],[-5,51],[-4,53],[-3,55],[-4,57],[-5,58],[-2,57],[0,58],[1,53],[0,51],[-4,50],[-6,50]],
    [[-10,52],[-10,54],[-8,55],[-6,54],[-7,52],[-10,52]]
  ];

  var issLat = 0;
  var issLon = 0;
  var targetLon = 0;
  var targetLat = 0;
  var currentCenterLon = 0;
  var currentCenterLat = 0;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();
  window.addEventListener("resize", resize);

  // Orthographic projection centered on (centerLon, centerLat)
  function project(lon, lat, cLon, cLat, R) {
    var rl = lon * Math.PI / 180;
    var rp = lat * Math.PI / 180;
    var rc = cLon * Math.PI / 180;
    var rpc = cLat * Math.PI / 180;

    var cosC = Math.sin(rpc) * Math.sin(rp) + Math.cos(rpc) * Math.cos(rp) * Math.cos(rl - rc);
    if (cosC < 0) return null; // behind the globe

    var x = R * Math.cos(rp) * Math.sin(rl - rc);
    var y = R * (Math.cos(rpc) * Math.sin(rp) - Math.sin(rpc) * Math.cos(rp) * Math.cos(rl - rc));
    return { x: x, y: -y };
  }

  function draw() {
    var rect = canvas.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;
    var cx = w / 2;
    var cy = h / 2;
    var R = Math.min(w, h) * 0.42;

    ctx.clearRect(0, 0, w, h);

    // Smooth follow the ISS
    currentCenterLon += (targetLon - currentCenterLon) * 0.04;
    currentCenterLat += (targetLat - currentCenterLat) * 0.04;

    // Globe outline circle
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = "#bbb";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Graticule: faint lat/lon lines every 30°
    ctx.strokeStyle = "rgba(0,0,0,0.05)";
    ctx.lineWidth = 0.5;
    var i, j, p;
    // Latitude lines
    for (i = -60; i <= 60; i += 30) {
      ctx.beginPath();
      var started = false;
      for (j = -180; j <= 180; j += 3) {
        p = project(j, i, currentCenterLon, currentCenterLat, R);
        if (p) {
          if (!started) { ctx.moveTo(cx + p.x, cy + p.y); started = true; }
          else ctx.lineTo(cx + p.x, cy + p.y);
        } else { started = false; }
      }
      ctx.stroke();
    }
    // Longitude lines
    for (i = -150; i <= 180; i += 30) {
      ctx.beginPath();
      var started2 = false;
      for (j = -90; j <= 90; j += 3) {
        p = project(i, j, currentCenterLon, currentCenterLat, R);
        if (p) {
          if (!started2) { ctx.moveTo(cx + p.x, cy + p.y); started2 = true; }
          else ctx.lineTo(cx + p.x, cy + p.y);
        } else { started2 = false; }
      }
      ctx.stroke();
    }

    // Draw continent outlines
    ctx.strokeStyle = "#888";
    ctx.lineWidth = 0.8;
    for (i = 0; i < CONTINENTS.length; i++) {
      var coast = CONTINENTS[i];
      ctx.beginPath();
      var started3 = false;
      for (j = 0; j < coast.length; j++) {
        p = project(coast[j][0], coast[j][1], currentCenterLon, currentCenterLat, R);
        if (p) {
          if (!started3) { ctx.moveTo(cx + p.x, cy + p.y); started3 = true; }
          else ctx.lineTo(cx + p.x, cy + p.y);
        } else { started3 = false; }
      }
      ctx.stroke();
    }

    // Draw ISS position
    var issP = project(issLon, issLat, currentCenterLon, currentCenterLat, R);
    if (issP) {
      // Small crosshair
      var ix = cx + issP.x;
      var iy = cy + issP.y;
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(ix - 6, iy); ctx.lineTo(ix - 2, iy);
      ctx.moveTo(ix + 2, iy); ctx.lineTo(ix + 6, iy);
      ctx.moveTo(ix, iy - 6); ctx.lineTo(ix, iy - 2);
      ctx.moveTo(ix, iy + 2); ctx.lineTo(ix, iy + 6);
      ctx.stroke();

      // Small filled dot
      ctx.fillStyle = "#444";
      ctx.beginPath();
      ctx.arc(ix, iy, 2, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.font = "9px sans-serif";
      ctx.fillStyle = "#999";
      ctx.fillText("ISS", ix + 8, iy + 3);
    }

    requestAnimationFrame(draw);
  }

  function fetchISS() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "https://api.wheretheiss.at/v1/satellites/25544");
    xhr.timeout = 5000;
    xhr.onload = function() {
      if (xhr.status === 200) {
        try {
          var d = JSON.parse(xhr.responseText);
          issLat = parseFloat(d.latitude);
          issLon = parseFloat(d.longitude);
          targetLon = issLon;
          targetLat = issLat;
        } catch(e) {}
      }
    };
    xhr.onerror = function() {
      // Fallback: slowly drift for visual interest
      issLon = (issLon + 0.5) % 360;
      if (issLon > 180) issLon -= 360;
      targetLon = issLon;
    };
    xhr.send();
  }

  fetchISS();
  setInterval(fetchISS, 5000);
  draw();
})();
</script>
</body>
</html>
