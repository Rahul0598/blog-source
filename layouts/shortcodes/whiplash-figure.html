{{- /* Static SVG figure for the snip-snap post: no scripts or extra stylesheets. */ -}}
{{- $src := printf "posts/whiplash/figures/%s" (.Get "src") | relURL -}}
<figure style="margin:1.3rem 0">
  <img src="{{ $src }}" width="720" height="{{ .Get "height" }}" alt="{{ .Get "alt" }}" loading="lazy" decoding="async"
    style="display:block;width:100%;height:auto">
  {{- with .Get "caption" }}
  <figcaption style="font-size:.85rem">{{ . | markdownify }}</figcaption>
  {{- end }}
</figure>
